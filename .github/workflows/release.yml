name: Release

# Tag pushes only — no path filter (a release must always build), kept separate
# from build.yml so the CI path filters can't accidentally skip a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to attach the jar to the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release jar (compile + test + shadowJar)
        run: ./gradlew build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/BlueMapPortalMarkers-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
