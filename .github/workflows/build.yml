name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    # Default types plus ready_for_review, so un-drafting a PR triggers a build.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

# Least privilege: CI only needs to read the repo (artifact upload needs no extra scope).
permissions:
  contents: read

# One in-flight run per ref; cancel superseded runs on PR branches (but let
# main builds finish so the default branch always has a complete result).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # main pushes always run; PR builds are skipped while the PR is a draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party and first-party actions are pinned to a full commit SHA
      # (mutable tags can be repointed); the trailing comment tracks the version.
      # Dependabot (.github/dependabot.yml) keeps these SHAs up to date.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # JDK 25 (LTS): the project compiles --release 25 and the pinned Gradle 9.4
      # wrapper runs on JDK 25, so CI does not need the dev host's JDK 26.
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BlueMapPortalMarkers-jar
          path: build/libs/*.jar
          if-no-files-found: error
