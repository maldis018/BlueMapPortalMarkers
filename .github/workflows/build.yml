name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    # Default types plus ready_for_review, so un-drafting a PR triggers a build.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

# One in-flight run per ref; cancel superseded runs on PR branches (but let
# main builds finish so the default branch always has a complete result).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # main pushes always run; PR builds are skipped while the PR is a draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # JDK 25 (LTS): the project compiles --release 25 and the pinned Gradle 9.4
      # wrapper runs on JDK 25, so CI does not need the dev host's JDK 26.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlueMapPortalMarkers-jar
          path: build/libs/*.jar
          if-no-files-found: error
