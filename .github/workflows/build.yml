name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed by the release job to attach the jar to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 25 (LTS): the project compiles --release 25 and the pinned Gradle 9.4
      # wrapper runs on JDK 25, so CI does not need the dev host's JDK 26.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + test + jar)
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueMapPortalMarkers-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    # Only on a version tag; reuses the same build then publishes the jar.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jar
        run: ./gradlew build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/BlueMapPortalMarkers-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
