# BlueMapPortalMarkers configuration

markers:
  # Label shown for the toggleable marker set in the BlueMap UI
  label: "Nether Portals"
  # Whether the layer starts hidden (users toggle it on)
  default-hidden: false
  # Custom icon asset address relative to the BlueMap web root.
  # Leave empty to use BlueMap's default POI icon.
  icon: ""
  # Icon anchor in pixels (where the icon "points"). Only used if icon is set.
  icon-anchor-x: 25
  icon-anchor-y: 45
  # Minimum camera distance (metres) at which this portal is visible on the map.
  # 0 = always visible. Useful to hide markers at very close zoom levels.
  min-distance: 0
  # Maximum camera distance (metres) at which this portal is visible on the map.
  # 0 = always visible. Useful to declutter the map at high zoom levels.
  max-distance: 0
  # Sort order for the marker in the BlueMap layer list (lower = higher in list).
  sorting: 0
  # Label template for each portal marker. Supports: {world}, {x}, {y}, {z}.
  # Leave empty for the default label "Nether Portal".
  label-template: ""

discovery:
  # Radius (in blocks) of the upfront POI sweep performed around spawn and
  # online players when the server/world loads. Larger = more coverage, more work.
  sweep-radius: 256
  # Also query POIs when a chunk loads (cheap; covers areas players roam into).
  scan-on-chunk-load: true
  # Per-world include/exclude filtering. Useful to skip creative or minigame worlds.
  worlds:
    # "blacklist" tracks all worlds except those listed; "whitelist" tracks only
    # the worlds listed.
    mode: blacklist
    list: []
  # Periodic background sweep to cover areas players have roamed into since last
  # startup. Opt-in: enable only after confirming acceptable performance on your
  # server. Requires restart or /bmportals reload after changing.
  background-sweep:
    enabled: false
    # How often to sweep (seconds). Minimum 30.
    interval-seconds: 300
    # Maximum number of online player positions swept per pass. Players are cycled
    # in rotation so all are covered over successive passes. Spawn is always swept.
    max-players-per-pass: 3

linking:
  # Add a "predicted link" section to each portal's popup, pairing it with its
  # counterpart in the other dimension via the vanilla 8:1 rule and (when a
  # portal is already known near the predicted spot) a clickable BlueMap
  # deep-link to it. This is a prediction, not a guarantee.
  enabled: true
  # Horizontal search radius (blocks) around the predicted target within which a
  # known portal counts as the link.
  search-tolerance: 128

storage:
  # File (under the plugin data folder) where discovered portals are persisted.
  file: "portals.json"

logging:
  # When true, verbose diagnostics (per-chunk discovery, marker rebuilds, sweep
  # counts) are printed to the console with a [DEBUG] prefix. Normal events
  # (portal added/removed, startup sweep total) always log at INFO regardless.
  debug: false

metrics:
  # Anonymous usage statistics via bStats (https://bstats.org/plugin/bukkit/...).
  # Aggregate only; no personal or world data. Set false to opt out (bStats also
  # honours the server-wide opt-out in plugins/bStats/config.yml).
  enabled: true

update-check:
  # On enable, check GitHub Releases for a newer version and log one INFO line if
  # found. Runs off the main thread and fails silently when offline.
  enabled: true
